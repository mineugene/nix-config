[core]
plugins = autostart blur place
vwidth = 1
vheight = 1
xwayland = false

[input]
cursor_theme = capitaine-cursors-white
cursor_size = 24
mouse_accel_profile = flat
touchpad_accel_profile = flat
mouse_cursor_speed = -0.25
touchpad_cursor_speed = -0.25

[blur]
blur_by_default = app_id is "greetd-motd"
method = kawase
kawase_offset = 5
kawase_degrade = 1
kawase_iterations = 2

[autostart]
autostart_wf_shell = false
greeter = /etc/greetd/greeter-session
