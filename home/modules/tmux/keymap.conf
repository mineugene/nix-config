# --- Windows ---
bind -N 'new window' c new-window -c "#{pane_current_path}"
unbind C-n
unbind C-p
bind -N 'next window' n next-window
bind -N 'previous window' p previous-window
bind -N 'move window back' N swap-window -t -1 \; select-window -t -1
bind -N 'move window forward' P swap-window -t +1 \; select-window -t +1
bind -N 'last window' Tab last-window

bind -N 'window 1' 1 select-window -t:1
bind -N 'window 2' 2 select-window -t:2
bind -N 'window 3' 3 select-window -t:3
bind -N 'window 4' 4 select-window -t:4
bind -N 'window 5' 5 select-window -t:5
bind -N 'window 6' 6 select-window -t:6
bind -N 'window 7' 7 select-window -t:7
bind -N 'window 8' 8 select-window -t:8
bind -N 'window 9' 9 select-window -t:9
bind -N 'window 10' 0 select-window -t:10

# --- Panes ---
unbind '"'
unbind '%'
bind -N 'split down' s split-window -v -c "#{pane_current_path}"
bind -N 'split right' v split-window -h -c "#{pane_current_path}"
bind -N 'split full height' S split-window -fv -c "#{pane_current_path}"
bind -N 'split full width' V split-window -fh -c "#{pane_current_path}"

unbind Up
unbind Down
unbind Left
unbind Right

bind -N 'focus left' h select-pane -L
bind -N 'focus down' j select-pane -D
bind -N 'focus up' k select-pane -U
bind -N 'focus right' l select-pane -R

# Resize on Alt plus vim's <C-w><>+- glyphs, 3 cells per press. The glyphs
# stay bare in normal typing, so a repeat window can never eat a keystroke.
bind -r -N 'resize left' M-< resize-pane -L 3
bind -r -N 'resize right' M-> resize-pane -R 3
bind -r -N 'resize up' M-- resize-pane -U 3
bind -r -N 'resize down' M-+ resize-pane -D 3

# Deleting any unbind below revives a tmux default that resizes the same
# panes by 5 cells without repeating.
unbind '<'
unbind '>'
unbind '-'
unbind '+'
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
unbind M-Up
unbind M-Down
unbind M-Left
unbind M-Right

bind -N 'next pane' o select-pane -t :.+
bind -N 'previous pane' O select-pane -t :.-
bind -N 'swap pane up' '{' swap-pane -U
bind -N 'swap pane down' '}' swap-pane -D
bind -N 'zoom pane' z resize-pane -Z

# --- Copy mode (vim-consistent) ---
bind -N 'copy mode' C-v copy-mode
bind -T copy-mode-vi -N 'begin selection' v send-keys -X begin-selection
bind -T copy-mode-vi -N 'select line' V send-keys -X select-line
bind -T copy-mode-vi -N 'rectangle toggle' C-v send-keys -X rectangle-toggle

bind -T copy-mode-vi -N 'copy selection' y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi -N 'copy to end of line' Y send-keys -X copy-end-of-line-and-cancel
bind -T copy-mode-vi -N 'cancel copy mode' Escape send-keys -X cancel

bind -N 'copy mode search' '/' copy-mode \; send-keys "/"
bind -N 'paste buffer' C-y paste-buffer -s ""
bind -N 'choose buffer' b choose-buffer "paste-buffer -b '%%' -s ''"

bind -N 'kill session' Q confirm-before -p "Kill session #S? (y/N)" kill-session

# --- Key bindings ---
# A key bound here is also reset here on every reload; tmux otherwise keeps a
# binding that a newer config no longer mentions.
bind -N 'List key bindings' '?' list-keys -N

# --- Session switcher ---
# Mirrors the zle widget on Alt-t. Replaces the default clock-mode binding.
unbind t
bind -N 'session switcher' t display-popup -B -E -w 80% -h 60% "zsh $HOME/.config/zsh/widgets/tmux-session-switcher"
bind -N 'next active session' a run-shell -b 'pi-session-tracker focus-next "#{pane_id}" "#{client_name}"'

# --- Reload ---
bind -N 'reload config' r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
