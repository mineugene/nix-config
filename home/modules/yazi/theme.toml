[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#a9b1d6", italic = true }

# Find
find_keyword  = { fg = "#16161e", bg = "#ff9e64", bold = true }
find_position = { fg = "#0db9d7", bg = "#192b38", bold = true }

# Marker
marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#bb9af7", bg = "#bb9af7" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

# Count
count_copied   = { fg = "#16161e", bg = "#9ece6a" }
count_cut      = { fg = "#16161e", bg = "#f7768e" }
count_selected = { fg = "#16161e", bg = "#7aa2f7" }

# Border
border_symbol = "│"
border_style  = { fg = "#565f89" }

# Tab
[tabs]
active   = { fg = "#15161e", bg = "#7aa2f7" }
inactive = { fg = "#7aa2f7", bg = "#3b4261" }

[mode]
normal_main = { fg = "#1a1b26", bg = "#bb9af7" }
normal_alt  = { fg = "#bb9af7", bg = "#0c0e14" }

select_main = { fg = "#1a1b26", bg = "#e0af68" }
select_alt  = { fg = "#e0af68", bg = "#0c0e14" }

unset_main  = { fg = "#1a1b26", bg = "#f7768e" }
unset_alt   = { fg = "#f7768e", bg = "#0c0e14" }

# Hovered file in the parent, current, and preview panes
[indicator]
parent  = { bg = "#292e42", reversed = false }
current = { bg = "#292e42", reversed = false }
preview = { underline = false }

[icon]
conds = [
    { if = "orphan", text = "", fg = "#ffffff" },
    { if = "link & dir", text = "", fg = "#9e9e9e" },
    { if = "link", text = "", fg = "#9e9e9e" },
    { if = "block", text = "", fg = "#cddc39" },
    { if = "char", text = "", fg = "#cddc39" },
    { if = "fifo", text = "", fg = "#cddc39" },
    { if = "sock", text = "", fg = "#cddc39" },
    { if = "sticky", text = "", fg = "#cddc39" },
    { if = "dummy", text = "", fg = "#f44336" },
    { if = "dir & hovered", text = "", fg = "#03a9f4" },
    { if = "dir", text = "", fg = "#03a9f4" },
    { if = "exec", text = "", fg = "#8bc34a" },
    { if = "!dir", text = "", fg = "#ffffff" },
]

[status]
overall   = { fg = "#a9b1d6", bg = "reset" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#565f89", bg = "#0c0e14" }
progress_error  = { fg = "#f7768e", bg = "#0c0e14" }

# Permissions
perm_type  = { fg = "#a9b1d6" }
perm_read  = { fg = "#a9b1d6" }
perm_write = { fg = "#a9b1d6" }
perm_exec  = { fg = "#a9b1d6" }
perm_sep   = { fg = "#a9b1d6" }

[pick]
border   = { fg = "#27a1b9" }
active   = { fg = "#c0caf5",  bg = "#283457" }
inactive = { fg = "#c0caf5" }

# Input
[input]
border   = { fg = "#0db9d7" }
title    = { fg = "#0db9d7" }
value    = { fg = "#9d7cd8" }
selected = { bg = "#283457" }

# Completion
[cmp]
border   = { fg = "#0db9d7" }
active   = { fg = "#c0caf5", bg = "#343a55" }
inactive = { fg = "#c0caf5" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# Tasks
[tasks]
border  = { fg = "#27a1b9" }
title   = { fg = "#27a1b9" }
hovered = { fg = "#c0caf5", bg = "#283457" }

# Which
[which]
cols            = 3
mask            = { bg = "#16161e" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#7aa2f7" }
desc            = { fg = "#bb9af7" }
separator       = " ➜ "
separator_style = { fg = "#565f89" }

# Confirm
[confirm]
border  = { fg = "#0db9d7" }
title   = { fg = "#27a1b9" }
body    = {}
list    = {}
btn_yes = { bg = "#283457" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# Spot
[spot]
border  = { fg = "#27a1b9" }
title   = { fg = "#27a1b9" }

# Notify
[notify]
title_info  = { fg = "#0db9d7" }
title_warn  = { fg = "#e0af68" }
title_error = { fg = "#db4b4b" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
border  = { fg = "#0db9d7" }
chord   = { fg = "#9ece6a" }
action  = { fg = "#7dcfff" }
hovered = { bg = "#292e42" }

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#e0af68" },

	# Media
	{ mime = "{audio,video}/*", fg = "#bb9af7" },

	# Archives
	{ mime = "application/*zip", fg = "#f7768e" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f7768e" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#7dcfff" },

	# Empty files
	# { mime = "inode/x-empty", fg = "#f7768e" },

	# Special files
	{ url = "*", is = "orphan", bg = "#f7768e" },
	{ url = "*", is = "exec"  , fg = "#9ece6a" },

	# Fallback
	{ url = "*/", fg = "#7aa2f7" },
	{ url = "*", fg = "#c0caf5" }
]
